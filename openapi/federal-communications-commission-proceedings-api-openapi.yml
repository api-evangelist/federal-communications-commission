openapi: 3.2.0
info:
  title: FCC ECFS Proceedings API
  description: The FCC Electronic Comment Filing System (ECFS) public API provides programmatic access to filings, proceedings, and submissions made to the Federal Communications Commission.
  version: '1.0'
  contact:
    name: FCC Developer
    url: https://www.fcc.gov/reports-research/developers
servers:
- url: https://publicapi.fcc.gov/ecfs
  description: ECFS public API
security:
- apiKey: []
tags:
- name: Proceedings
paths:
  /proceedings:
    get:
      operationId: listProceedings
      summary: Search ECFS proceedings
      description: Returns a list of proceedings (dockets) registered in the FCC ECFS system.
      tags:
      - Proceedings
      parameters:
      - name: api_key
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 25
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      - name: name
        in: query
        schema:
          type: string
        description: Proceeding (docket) number filter.
      responses:
        '200':
          description: Proceedings response
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: query
      name: api_key
      description: api.data.gov API key passed as a query parameter.
